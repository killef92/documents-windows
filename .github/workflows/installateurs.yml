# Builds the Windows installer (setup .exe).
# Started by hand only (Actions tab → Installers → Run workflow), for a version to ship:
# GitHub Actions minutes are limited (Windows counts ×2).
# Tests and Clippy run beforehand, on the development machine.
# Actions are pinned to an exact version (hash), so that a change made by their author
# can't slip into the build.
# The setup can be downloaded at the bottom of the run's page, "Artifacts" section.
# Started on the main branch, it is also published in the "Latest version" release,
# with the latest.json file that lets the app update itself.
name: Installers

on:
  workflow_dispatch:

concurrency:
  group: installateurs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Key that signs updates (repository Settings → Secrets → Actions).
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install the interface dependencies
        run: npm ci

      - name: Download PDFium
        shell: bash
        run: scripts/pdfium.sh win-x64

      - name: Update the license list
        run: python scripts/licences.py

      - name: Version number
        shell: bash
        run: python scripts/version.py ${{ github.run_number }}

      - name: Build the installer
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::No signing key: the automatic update will not be published."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build
          fi

      - name: Rename the setup
        shell: bash
        run: |
          mkdir -p sortie maj
          cp target/release/bundle/nsis/*-setup.exe sortie/Documents-setup.exe
          cp target/release/bundle/nsis/*-setup.exe.sig maj/Documents-setup.exe.sig 2>/dev/null || true

      - name: Make the setup downloadable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Documents-setup
          path: sortie/Documents-setup.exe
          if-no-files-found: error

      - name: Keep the signature for the update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maj-windows
          path: maj/
          if-no-files-found: ignore

  # main branch only: publishes the installers and the automatic update.
  publier:
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: telechargements
          merge-multiple: true

      # The signatures are only used for latest.json: set them aside.
      - name: Set the signatures aside
        run: |
          mkdir -p signatures
          mv telechargements/*.sig signatures/ 2>/dev/null || true

      - name: Publish in "Latest version"
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: derniere-version
          name: Latest version
          prerelease: true
          make_latest: false
          body: |
            Version 0.2.${{ github.run_number }}.
            Windows: download **Documents-setup.exe**.
            Installed copies update themselves.
          files: telechargements/*

      # latest.json is kept in the "versions" branch, which the app reads. Private repository: it
      # points to the GitHub API (files by number, read with the app's key); public: to the
      # ordinary download links.
      - name: Publish latest.json in the "versions" branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/tags/derniere-version > release.json
          export DEPOT_PRIVE=$(gh api repos/${{ github.repository }} --jq .private)
          mkdir -p fiche
          python3 scripts/latest_json.py signatures release.json ${{ github.run_number }} fiche/latest.json
          [ -f fiche/latest.json ] || exit 0
          cd fiche
          git init -q -b versions
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -q -m "Version 0.2.${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" versions

