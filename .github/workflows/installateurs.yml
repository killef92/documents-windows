# Fabrique l'installateur Windows (setup .exe).
# Lancé à la main seulement (onglet Actions → Installateurs → Run workflow), pour une
# version à livrer : les minutes GitHub Actions sont comptées (Windows ×2).
# Les tests et Clippy se font avant, sur la machine de développement.
# Les actions sont épinglées sur une version précise (empreinte), pour qu'un changement chez
# leur auteur ne puisse pas s'inviter dans la construction.
# Il se télécharge en bas de la page du « run », section « Artifacts ».
# Lancé sur la branche main, il est aussi publié dans la release « Dernière version »,
# avec le fichier latest.json qui permet à l'appli de se mettre à jour toute seule.
name: Installateurs

on:
  workflow_dispatch:

concurrency:
  group: installateurs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # Clé qui signe les mises à jour (Réglages du dépôt → Secrets → Actions).
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Installer les dépendances de l'interface
        run: npm ci

      - name: Télécharger PDFium
        shell: bash
        run: scripts/pdfium.sh win-x64

      - name: Mettre à jour la liste des licences
        run: python scripts/licences.py

      - name: Numéro de version
        shell: bash
        run: python scripts/version.py ${{ github.run_number }}

      - name: Construire l'installateur
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::warning::Pas de clé de signature : la mise à jour automatique ne sera pas publiée."
            npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
          else
            npx tauri build
          fi

      - name: Renommer le setup
        shell: bash
        run: |
          mkdir -p sortie maj
          cp target/release/bundle/nsis/*-setup.exe sortie/Documents-setup.exe
          cp target/release/bundle/nsis/*-setup.exe.sig maj/Documents-setup.exe.sig 2>/dev/null || true

      - name: Mettre le setup en téléchargement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Documents-setup
          path: sortie/Documents-setup.exe
          if-no-files-found: error

      - name: Garder la signature pour la mise à jour
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: maj-windows
          path: maj/
          if-no-files-found: ignore

  # Branche main seulement : publie les installateurs et la mise à jour automatique.
  publier:
    if: github.ref == 'refs/heads/main'
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: telechargements
          merge-multiple: true

      # Les signatures servent seulement à latest.json : on les met de côté.
      - name: Mettre les signatures de côté
        run: |
          mkdir -p signatures
          mv telechargements/*.sig signatures/ 2>/dev/null || true

      - name: Publier dans « Dernière version »
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: derniere-version
          name: Dernière version
          prerelease: true
          make_latest: false
          body: |
            Version 0.2.${{ github.run_number }}.
            Windows : télécharger **Documents-setup.exe**.
            Les versions déjà installées se mettent à jour toutes seules.
          files: telechargements/*

      # latest.json est rangé dans la branche « versions », que l'appli lit. Dépôt privé : il pointe
      # vers l'API GitHub (fichiers par numéro, lus avec la clé de l'appli) ; public : vers les
      # liens de téléchargement ordinaires.
      - name: Publier latest.json dans la branche « versions »
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/releases/tags/derniere-version > release.json
          export DEPOT_PRIVE=$(gh api repos/${{ github.repository }} --jq .private)
          mkdir -p fiche
          python3 scripts/latest_json.py signatures release.json ${{ github.run_number }} fiche/latest.json
          [ -f fiche/latest.json ] || exit 0
          cd fiche
          git init -q -b versions
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json
          git commit -q -m "Version 0.2.${{ github.run_number }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" versions

